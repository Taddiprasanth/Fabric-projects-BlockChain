server:
  port: 8080
  servlet:
    context-path: /

spring:
  application:
    name: financial-asset-api
  profiles:
    active: dev

logging:
  level:
    org.example: DEBUG
    org.hyperledger.fabric: INFO
    org.springframework.web: INFO
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} - %msg%n"

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always

# Fabric configuration
fabric:
  network:
    name: mychannel
    contract: financial-asset
  connection:
    profile: connection-org1.yaml
    wallet: wallet
    identity: appUser
